<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#10271f">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="PadelPunkt">

<title>PadelPunkt</title>

<style>

:root {

  color-scheme: dark;

  --bg: #10271f;

  --panel: #1c382d;

  --text: #f5f7ef;

  --muted: #b8cabe;

  --lime: #d5fa69;

  --blue: #9edbff;

}

* { box-sizing: border-box; }

body {

  margin: 0;

  background: var(--bg);

  color: var(--text);

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  min-height: 100vh;

  padding: max(16px, env(safe-area-inset-top)) 16px

           max(20px, env(safe-area-inset-bottom));

}

main { max-width: 560px; margin: auto; }

header { text-align: center; padding: 8px 0 18px; }

.logo { font-size: 34px; font-weight: 900; letter-spacing: -1.5px; }

.logo span { color: var(--lime); }

.subtitle { color: var(--muted); font-size: 13px; margin-top: 5px; }

.scoreboard {

  background: var(--panel);

  border-radius: 22px;

  padding: 16px;

  margin-bottom: 14px;

}

.sets {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

  margin-bottom: 16px;

}

.set-box {

  background: #10271f;

  border-radius: 14px;

  padding: 12px;

  text-align: center;

}

.small-label {

  color: var(--muted);

  font-size: 12px;

  text-transform: uppercase;

  letter-spacing: 1px;

}

.set-number { font-size: 32px; font-weight: 850; margin-top: 3px; }

.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.team {

  border-radius: 17px;

  padding: 15px 8px;

  text-align: center;

  background: #29483a;

  min-width: 0;

}

.team.b { background: #243f50; }

.team-name { font-weight: 750; font-size: 16px; }

.game-number { font-size: 46px; font-weight: 900; line-height: 1.2; margin: 6px 0; }

.point-number { font-size: 27px; font-weight: 800; color: var(--lime); }

.team.b .point-number { color: var(--blue); }

.point-label { font-size: 11px; color: var(--muted); }

.current {

  font-size: 12px;

  color: var(--muted);

  text-align: center;

  margin-top: 15px;

}

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

button {

  font: inherit;

  cursor: pointer;

  border: 0;

  border-radius: 17px;

  font-weight: 800;

  -webkit-tap-highlight-color: transparent;

  touch-action: manipulation;

}

.point-btn {

  min-height: 112px;

  padding: 14px 8px;

  color: #10271f;

  background: var(--lime);

  font-size: 18px;

}

.point-btn.b { background: var(--blue); }

.plus { display: block; font-size: 31px; margin-bottom: 5px; }

.utility {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

  margin-top: 12px;

}

.secondary {

  padding: 15px 8px;

  background: var(--panel);

  color: var(--text);

  font-size: 14px;

  min-height: 50px;

}

.danger { color: #ffb4a9; }

.note {

  color: var(--muted);

  font-size: 12px;

  line-height: 1.5;

  text-align: center;

  padding: 18px 8px 0;

}

button:active { transform: scale(.98); }

button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

[hidden] { display: none !important; }

@media (max-width: 360px) {

  body { padding-left: 10px; padding-right: 10px; }

  .logo { font-size: 29px; }

  .game-number { font-size: 39px; }

  .point-btn { font-size: 16px; min-height: 100px; }

}

</style>

</head>

<body>

<main>

<header>

  <div class="logo">Padel<span>Punkt</span></div>

  <div class="subtitle">DEIN MATCH. DEIN PUNKT.</div>

</header>

<section class="scoreboard" aria-label="Spielstand">

  <div class="sets">

    <div class="set-box">

      <div class="small-label">Sätze · Team A</div>

      <div class="set-number" id="setsA">0</div>

    </div>

    <div class="set-box">

      <div class="small-label">Sätze · Team B</div>

      <div class="set-number" id="setsB">0</div>

    </div>

  </div>

  <div class="teams">

    <div class="team">

      <div class="team-name">TEAM A</div>

      <div class="game-number" id="gamesA">0</div>

      <div class="point-number" id="pointsA">0</div>

      <div class="point-label">SPIELE · PUNKTE</div>

    </div>

    <div class="team b">

      <div class="team-name">TEAM B</div>

      <div class="game-number" id="gamesB">0</div>

      <div class="point-number" id="pointsB">0</div>

      <div class="point-label">SPIELE · PUNKTE</div>

    </div>

  </div>

  <div class="current" id="status" aria-live="polite">Satz 1 · Spiel läuft</div>

</section>

<div class="actions">

  <button class="point-btn" id="addA">

    <span class="plus">＋</span>Punkt Team A

  </button>

  <button class="point-btn b" id="addB">

    <span class="plus">＋</span>Punkt Team B

  </button>

</div>

<div class="utility">

  <button class="secondary" id="undo">↶ Punkt rückgängig</button>

  <button class="secondary" id="newMatch">＋ Neues Match</button>

  <button class="secondary danger" id="reset">Match zurücksetzen</button>

  <button class="secondary" id="swap">⇄ Teams tauschen</button>

</div>

<div class="note">

  Spielstand wird auf diesem Gerät gespeichert.<br>

  Standardzählung mit Vorteil und Tie-Break bei 6:6.<br>

  Team A und Team B sind frei wählbare Seiten.

</div>

</main>

<script>

(() => {

  const KEY = "padelpunkt-v1";

  const fresh = () => ({

    sets: [0, 0],

    games: [0, 0],

    points: [0, 0],

    tie: false,

    tiePoints: [0, 0],

    finished: false,

    history: []

  });

  let state;

  try {

    const saved = JSON.parse(localStorage.getItem(KEY));

    state = saved && Array.isArray(saved.sets) ? saved : fresh();

    if (!Array.isArray(state.history)) state.history = [];

  } catch (_) {

    state = fresh();

  }

  function snapshot() {

    const copy = {...state};

    delete copy.history;

    state.history.push(JSON.stringify(copy));

    if (state.history.length > 100) state.history.shift();

  }

  function save() {

    try { localStorage.setItem(KEY, JSON.stringify(state)); }

    catch (_) {}

  }

  function finishGame(winner) {

    state.games[winner]++;

    state.points = [0, 0];

    if (state.games[winner] >= 6 &&

        state.games[winner] - state.games[1-winner] >= 2) {

      finishSet(winner);

      return;

    }

    if (state.games[0] === 6 && state.games[1] === 6) {

      state.tie = true;

      state.tiePoints = [0, 0];

    }

  }

  function finishSet(winner) {

    state.sets[winner]++;

    state.games = [0, 0];

    state.points = [0, 0];

    state.tie = false;

    state.tiePoints = [0, 0];

    if (state.sets[winner] >= 2) {

      state.finished = true;

    }

  }

  function addPoint(team) {

    if (state.finished) {

      alert("Das Match ist beendet. Starte ein neues Match.");

      return;

    }

    snapshot();

    if (state.tie) {

      state.tiePoints[team]++;

      const a = state.tiePoints[0], b = state.tiePoints[1];

      if (state.tiePoints[team] >= 7 &&

          state.tiePoints[team] - state.tiePoints[1-team] >= 2) {

        finishSet(team);

      }

    } else {

      const other = 1 - team;

      const p = state.points;

      if (p[team] < 3) {

        p[team]++;

      } else if (p[team] === 3 && p[other] < 3) {

        finishGame(team);

      } else if (p[team] === 3 && p[other] === 3) {

        p[team] = 4;

      } else if (p[team] === 4) {

        finishGame(team);

      } else if (p[other] === 4) {

        p[other] = 3;

      } else {

        p[team] = 3;

      }

    }

    render();

    save();

  }

  function pointText(team) {

    if (state.tie) return String(state.tiePoints[team]);

    const p = state.points, other = 1-team;

    const labels = ["0", "15", "30", "40", "Vorteil"];

    if (p[0] >= 3 && p[1] >= 3) {

      if (p[team] === 4) return "Vorteil";

      if (p[other] === 4) return "40";

      return "40";

    }

    return labels[Math.min(p[team], 4)];

  }

  function render() {

    document.getElementById("setsA").textContent = state.sets[0];

    document.getElementById("setsB").textContent = state.sets[1];

    document.getElementById("gamesA").textContent = state.games[0];

    document.getElementById("gamesB").textContent = state.games[1];

    document.getElementById("pointsA").textContent = pointText(0);

    document.getElementById("pointsB").textContent = pointText(1);

    let status = "Satz " + (state.sets[0] + state.sets[1] + 1)

      + " · Spiel läuft";

    if (state.tie) status = "Tie-Break · erster bis 7 mit 2 Punkten Vorsprung";

    if (state.finished) {

      status = state.sets[0] > state.sets[1]

        ? "🏆 Team A gewinnt das Match!"

        : "🏆 Team B gewinnt das Match!";

    }

    document.getElementById("status").textContent = status;

    document.getElementById("undo").disabled = state.history.length === 0;

    document.getElementById("addA").disabled = state.finished;

    document.getElementById("addB").disabled = state.finished;

  }

  function undo() {

    if (!state.history.length) return;

    const previous = JSON.parse(state.history.pop());

    const history = state.history;

    state = {...previous, history};

    render();

    save();

  }

  function resetMatch() {

    if (!confirm("Möchtest du das ganze Match wirklich zurücksetzen?")) return;

    state = fresh();

    render();

    save();

  }

  document.getElementById("addA").addEventListener("click", () => addPoint(0));

  document.getElementById("addB").addEventListener("click", () => addPoint(1));

  document.getElementById("undo").addEventListener("click", undo);

  document.getElementById("reset").addEventListener("click", resetMatch);

  document.getElementById("newMatch").addEventListener("click", resetMatch);

  document.getElementById("swap").addEventListener("click", () => {

    snapshot();

    [state.sets[0], state.sets[1]] = [state.sets[1], state.sets[0]];

    [state.games[0], state.games[1]] = [state.games[1], state.games[0]];

    [state.points[0], state.points[1]] = [state.points[1], state.points[0]];

    [state.tiePoints[0], state.tiePoints[1]] = [state.tiePoints[1], state.tiePoints[0]];

    render();

    save();

  });

  render();

})();

</script>

</body>

</html>
